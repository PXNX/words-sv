<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>WordCircle unterstützen</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <p class="kicker" data-i18n="kicker">WordCircle</p>
    <h1 id="greeting" data-i18n="title">WordCircle unterstützen</h1>
    <p data-i18n="intro">WordCircle bleibt kostenlos und ohne Werbung. Wenn dir die App hilft, kannst du ihre Entwicklung freiwillig mit Telegram Stars unterstützen.</p>
    <div id="tiers" class="tiers" role="group" aria-label="Betrag"></div>
    <p class="note" data-i18n="note">Freiwillige Spende, keine Gegenleistung, keine Erstattung.</p>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <button id="open-app" class="secondary" type="button" data-i18n="openApp">📚 WordCircle öffnen</button>
  </main>
  <footer>
    <a href="https://words-sv.vercel.app/bedingungen" data-i18n="terms">Bedingungen</a>
    <a href="https://words-sv.vercel.app/datenschutz" data-i18n="privacy">Datenschutz</a>
    <a href="https://words-sv.vercel.app/impressum" data-i18n="imprint">Impressum</a>
  </footer>
  <script src="app.js"></script>
</body>
</html>
