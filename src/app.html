<!doctype html>

<html
	lang="%paraglide.lang%"
	data-theme="light"
	dir="%paraglide.dir%"
>
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>

		<meta name="theme-color" content="#172A45" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#172A45" />
		<meta name="background-color" content="#FFFDF7" />

		<meta
			name="description"
			content="WordCircle – ein zweisprachiges Wisch-Wortspiel."
		/>

		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<meta name="apple-mobile-web-app-title" content="WordCircle" />
		<meta name="mobile-web-app-capable" content="yes" />

		<!-- Edge-to-edge: the app draws under the system bars, so no browser chrome or URL bar shows -->
		<meta name="edge-to-edge" content="true" />
		<meta name="overscroll" content="none" />

		<link
			rel="icon"
			href="/favicon.svg"
			type="image/svg+xml"
		/>

		<link rel="manifest" href="/manifest.webmanifest" />

		<link
			rel="apple-touch-icon"
			href="/icons/wordcircle-192.png"
		/>
		<link rel="apple-touch-icon" sizes="152x152" href="/icons/wordcircle-152.png" />
		<link rel="apple-touch-icon" sizes="192x192" href="/icons/wordcircle-192.png" />
		<link rel="apple-touch-icon" sizes="512x512" href="/icons/wordcircle-512.png" />

		<link rel="apple-config-premium" href="/apple-app-site-association.json" />
		<link rel="manifest" href="/manifest.webmanifest" />

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
