<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#172A45" />
    <meta name="robots" content="noindex" />
    <title>404 · WordCircle</title>
    <style>
      :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height:100svh;margin:0;display:grid;place-items:center;padding:1.25rem;background:radial-gradient(circle at 50% 20%,rgba(230,165,39,.14),transparent 32%),#ede4d5;color:#172a45; }
      main { width:min(100%,28rem);padding:clamp(1.6rem,7vw,2.75rem);border:1px solid #172a45;border-top:4px double #172a45;background:#fffdf7;box-shadow:10px 10px 0 rgba(164,94,56,.16);text-align:center; }
      .mark { position:relative;width:48px;height:48px;display:block;margin:0 auto 1rem; }.mark i,.mark b { position:absolute;display:block;width:28px;height:28px;border:3px solid #172a45;border-radius:50%; }.mark i { top:1px;left:1px; }.mark b { right:1px;bottom:1px;border-color:#e6a527; }
      .code { margin:0;color:#a45e38;font-size:.65rem;font-weight:900;letter-spacing:.18em; }.title { margin:.35rem 0 .75rem;font-family:Georgia,serif;font-size:clamp(2rem,9vw,3rem);font-weight:400;letter-spacing:-.045em;line-height:.95; }.copy { max-width:23rem;margin:0 auto 1.35rem;color:#596477;font-size:.78rem;font-weight:700;line-height:1.5; }
      a { display:inline-flex;align-items:center;justify-content:center;min-height:2.7rem;padding:0 1rem;border:1px solid #172a45;background:#172a45;color:#fffdf7;font-size:.64rem;font-weight:900;letter-spacing:.09em;text-decoration:none;text-transform:uppercase; } a:focus-visible { outline:3px solid #e6a527;outline-offset:3px; }
      @media (prefers-color-scheme: dark) { body { background:radial-gradient(circle at 50% 20%,rgba(230,165,39,.18),transparent 32%),#172a45;color:#fffdf7; } main { border-color:#fffdf7;background:#213a5d; }.mark i { border-color:#fffdf7; }.copy { color:rgba(255,253,247,.72); } }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <span class="mark" aria-hidden="true"><i></i><b></b></span>
      <p class="code">404</p>
      <h1 class="title" id="title">This trail has no word.</h1>
      <p class="copy">The page you requested is not in today’s WordCircle folio. Return to the puzzle and draw a new path.</p>
      <a href="/circle">Return to WordCircle</a>
    </main>
  </body>
</html>
